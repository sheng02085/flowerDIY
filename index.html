/* =========================================================================
   花材產生器（SVG）
   這裡用程式畫出向量花材，不需要真的圖片檔案。
   想「擴充」花材庫有兩種方式：
   1. 完全不用寫程式：在畫面左側切到「我的素材」分頁，上傳任何去背 PNG 圖片即可。
   2. 想加進預設花材庫：在下面 PRESETS 陣列多加一筆資料（可以直接用
      roundFlower() 畫花朵、leafShape() 畫葉子，或自己寫一段 SVG 字串）。
   ========================================================================= */

function evenAngles(count, start = 0) {
  const step = 360 / count;
  return Array.from({ length: count }, (_, i) => start + i * step);
}

function arcAngles(count, spread, center = 0) {
  if (count === 1) return [center];
  const step = spread / (count - 1);
  const start = center - spread / 2;
  return Array.from({ length: count }, (_, i) => start + i * step);
}

// 一片花瓣：預設朝上，再用 SVG rotate 轉到指定角度（0 = 朝上，順時針增加）
function petalPath(cx, cy, angleDeg, dist, rx, ry, color, opacity = 1) {
  const y = (cy - dist).toFixed(1);
  return `<ellipse cx="${cx}" cy="${y}" rx="${rx}" ry="${ry}" fill="${color}" opacity="${opacity}" transform="rotate(${angleDeg} ${cx} ${cy})"/>`;
}

// 用多層花瓣圍成一朵圓形花
function roundFlower({ size = 120, rings, centerColor, centerR, centerDots }) {
  const c = size / 2;
  let body = '';
  rings.forEach((r) => {
    const angles = r.angles || evenAngles(r.count, r.start || 0);
    angles.forEach((a) => {
      body += petalPath(c, c, a, r.dist, r.rx, r.ry, r.color, r.opacity ?? 1);
    });
  });
  body += `<circle cx="${c}" cy="${c}" r="${centerR}" fill="${centerColor}"/>`;
  if (centerDots) {
    evenAngles(centerDots.count).forEach((a) => {
      const rad = (a * Math.PI) / 180;
      const dx = (c + Math.cos(rad) * centerDots.dist).toFixed(1);
      const dy = (c + Math.sin(rad) * centerDots.dist).toFixed(1);
      body += `<circle cx="${dx}" cy="${dy}" r="${centerDots.r}" fill="${centerDots.color}"/>`;
    });
  }
  return `<svg viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg">${body}</svg>`;
}

// 一朵小花（用在配花上，可以放在任意座標）
function miniBloom(cx, cy, r, petalColor, centerColor, petalCount = 5) {
  let s = evenAngles(petalCount)
    .map((a) => petalPath(cx, cy, a, r * 0.85, r * 0.5, r * 0.85, petalColor))
    .join('');
  s += `<circle cx="${cx}" cy="${cy}" r="${(r * 0.35).toFixed(1)}" fill="${centerColor}"/>`;
  return s;
}

// 一片葉子：從 (cx,cy) 往上長出，再依角度旋轉
function leafShape(cx, cy, angleDeg, len, width, color, veinColor) {
  return `<g transform="rotate(${angleDeg} ${cx} ${cy})">
    <path d="M ${cx} ${cy} C ${cx - width} ${cy - len * 0.35}, ${cx - width * 0.3} ${cy - len}, ${cx} ${cy - len} C ${cx + width * 0.3} ${cy - len}, ${cx + width} ${cy - len * 0.35}, ${cx} ${cy} Z" fill="${color}"/>
    <line x1="${cx}" y1="${cy - 2}" x2="${cx}" y2="${cy - len * 0.85}" stroke="${veinColor}" stroke-width="0.8" opacity="0.6"/>
  </g>`;
}

function buildFern() {
  const stem = `<path d="M50 136 L50 10" stroke="#3F6A4E" stroke-width="1.8" fill="none"/>`;
  let leaves = '';
  let i = 0;
  for (let y = 125; y >= 20; y -= 11) {
    const side = i % 2 === 0 ? 1 : -1;
    leaves += leafShape(50, y, side * 60, 16, 7, '#4C7A57', '#3A5F45');
    leaves += leafShape(50, y, -side * 60, 16, 7, '#4C7A57', '#3A5F45');
    i++;
  }
  return `<svg viewBox="0 0 100 140" xmlns="http://www.w3.org/2000/svg">${stem}${leaves}</svg>`;
}

function buildCellophane() {
  const cx = 80, cy = 132;
  let s = '';
  for (let i = 0; i < 9; i++) {
    const a = ((-80 + i * 20) * Math.PI) / 180;
    const tipX = cx + Math.sin(a) * 118;
    const tipY = cy - Math.cos(a) * 118;
    s += `<path d="M${cx} ${cy} L${(tipX - 6).toFixed(1)} ${(tipY + 4).toFixed(1)} L${(tipX + 6).toFixed(1)} ${(tipY + 4).toFixed(1)} Z" fill="#F4EFE3" opacity="0.55" stroke="#E4DCC8" stroke-width="0.5"/>`;
  }
  return `<svg viewBox="0 0 160 140" xmlns="http://www.w3.org/2000/svg">${s}</svg>`;
}

// Apple 的標準彈簧緩動曲線，用在所有位移／縮放／透明度過場上，是「流暢感」的核心
const SPRING = 'cubic-bezier(0.32, 0.72, 0, 1)';

const clamp = (v, min, max) => Math.min(max, Math.max(min, v));

const imageCache = new Map();
function loadImage(src) {
  if (imageCache.has(src)) return imageCache.get(src);
  const p = new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = src;
  });
  imageCache.set(src, p);
  return p;
}

      {isCustom ? (

          <input
            type="number" min="0" value={material.price}
            onChange={(e) => onChangePrice(Number(e.target.value) || 0)}
            className="w-10 bg-transparent text-center"
          />
        </div>
      ) : (
        <div className="text-xs" style={{ color: ROSE }}>NT$ {material.price}</div>
      )}
    </div>
  );
}

function ToolbarBtn({ icon: iconName, label, onClick, danger }) {
  return (
    <button
      onClick={onClick}
      onPointerDown={(e) => e.stopPropagation()}
      title={label}
      className="p-2 rounded-full shrink-0 active:scale-85"
      style={{ color: danger ? '#F0A2AA' : '#F6F1E4', transition: `transform 0.15s ${SPRING}, background-color 0.15s` }}
    >
      <Icon name={iconName} size={15} />
    </button>
  );
}

// 分類標籤：桌面版側邊欄、手機版都共用同一份
function TabChips({ activeTab, onSelect }) {
  return (
    <div className="flex gap-2 overflow-x-auto px-3 pt-3 pb-2 min-w-0">
      {TABS.map((tab) => {
        const active = activeTab === tab.key;
        return (
          <button
            key={tab.key}
            onClick={() => onSelect(tab.key)}
            className="flex items-center gap-1.5 px-3.5 py-2 rounded-full text-xs font-medium whitespace-nowrap shrink-0 active:scale-95"
            style={{
              background: active ? FOREST : 'rgba(255,255,255,0.8)',
              color: active ? '#fff' : INK,
              border: `1px solid ${active ? FOREST : LINE}`,
              transition: `background-color 0.28s ${SPRING}, color 0.28s ${SPRING}, border-color 0.28s ${SPRING}, transform 0.15s ${SPRING}`,
            }}
          >
            <Icon name={tab.icon} size={14} /> {tab.label}
          </button>
        );
      })}
    </div>
  );
}

// 花材格子＋上傳區塊：桌面版側邊欄、手機版下滑面板都共用同一份
function MaterialPanel({ activeTab, visibleMaterials, customCount, onAdd, onDelete, onChangePrice, onChangeName, onFiles }) {
  const fileInputRef = useRef(null);
  return (
    <div className="p-3 overflow-y-auto flex-1">
      {activeTab === 'custom' && (
        <div className="mb-3">
          <button
            onClick={() => fileInputRef.current && fileInputRef.current.click()}
            style={{ borderColor: FOREST, color: FOREST, transition: `transform 0.15s ${SPRING}` }}
            className="w-full border-2 border-dashed rounded-2xl py-4 text-sm flex flex-col items-center gap-1 active:scale-95"
          >
            <Icon name="upload" size={18} /> 上傳我的花材圖片
          </button>
          <input
            ref={fileInputRef} type="file" accept="image/*" multiple className="hidden"
            onChange={(e) => { onFiles(e.target.files); e.target.value = ''; }}
          />
          <p className="text-xs opacity-60 mt-2" style={{ color: INK }}>上傳去背的花朵、葉子或緞帶圖片，就能加入花材庫，之後隨時都能使用。</p>
        </div>
      )}
      <div className="grid grid-cols-2 gap-2.5">
        {visibleMaterials.map((m) => (
          <MaterialCard
            key={m.id}
            material={m}
            isCustom={activeTab === 'custom'}
            onAdd={() => onAdd(m)}
            onDelete={() => onDelete(m.id)}
            onChangePrice={(p) => onChangePrice(m.id, p)}
            onChangeName={(n) => onChangeName(m.id, n)}
          />
        ))}
        {activeTab === 'custom' && customCount === 0 && (
          <p className="col-span-2 text-xs text-center py-6" style={{ color: INK, opacity: 0.5 }}>還沒有自訂花材，上傳圖片開始擴充你的花材庫吧</p>
        )}
      </div>
    </div>
  );
}

function BotanicalBouquetBuilder() {
  const [items, setItems] = useState([]);
  const [selectedId, setSelectedId] = useState(null);
  const [draggingId, setDraggingId] = useState(null);
  const [enteringId, setEnteringId] = useState(null);
  const [activeTab, setActiveTab] = useState('main');
  const [customMaterials, setCustomMaterials] = useState([]);
  const [showExport, setShowExport] = useState(false);
  const [exportUrl, setExportUrl] = useState(null);
  const [exporting, setExporting] = useState(false);
  const [pickerOpen, setPickerOpen] = useState(false);

  const canvasRef = useRef(null);
  const dragInfo = useRef(null);
  const nextZ = useRef(1);

  const visibleMaterials = activeTab === 'custom' ? customMaterials : PRESETS.filter((m) => m.category === activeTab);
  const selectedItem = items.find((i) => i.id === selectedId) || null;
  const totalPrice = items.reduce((sum, i) => sum + i.price, 0);

  // 工具列位置：跟著選取的花材走，優先浮在它正上方；靠近畫布頂端時改浮在下方，
  // 並讓左右不會超出畫布邊界。
  const TOOLBAR_HALF_W = 175;
  const TOOLBAR_H = 48;
  const TOOLBAR_GAP = 10;
  let toolbarLeft = 0;
  let toolbarTop = 0;
  if (selectedItem) {
    const cw = canvasRef.current ? canvasRef.current.clientWidth : 620;
    const ch = canvasRef.current ? canvasRef.current.clientHeight : 620;
    toolbarLeft = clamp(selectedItem.x, TOOLBAR_HALF_W, Math.max(TOOLBAR_HALF_W, cw - TOOLBAR_HALF_W));
    const above = selectedItem.y - selectedItem.h / 2 - TOOLBAR_GAP - TOOLBAR_H;
    toolbarTop = above < 4 ? selectedItem.y + selectedItem.h / 2 + TOOLBAR_GAP : above;
    toolbarTop = clamp(toolbarTop, 4, Math.max(4, ch - TOOLBAR_H - 4));
  }

  const updateItem = (id, patch) => setItems((prev) => prev.map((i) => (i.id === id ? { ...i, ...patch } : i)));

  const addItem = (material) => {
    const rect = canvasRef.current.getBoundingClientRect();
    const jitter = () => (Math.random() - 0.5) * 40;
    nextZ.current += 1;
    const newItem = {
      id: `item-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`,
      name: material.name,
      price: material.price,
      imageSrc: material.imageSrc,
      x: rect.width / 2 + jitter(),
      y: rect.height / 2 + jitter(),
      w: material.defaultW,
      h: material.defaultH,
      rotation: 0,
      flip: false,
      zIndex: nextZ.current,
    };
    setItems((prev) => [...prev, newItem]);
    setSelectedId(newItem.id);
    setEnteringId(newItem.id);
    // 用兩層 requestAnimationFrame 確保「進入前」的縮小狀態先被畫出一次，
    // 接著才切回正常狀態，這樣 CSS transition 才會真的播放出彈入效果
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        setEnteringId((cur) => (cur === newItem.id ? null : cur));
      });
    });
  };

  const bringFront = (id) => { nextZ.current += 1; updateItem(id, { zIndex: nextZ.current }); };
  const sendBack = (id) => setItems((prev) => {
    const minZ = Math.min(...prev.map((i) => i.zIndex));
    return prev.map((i) => (i.id === id ? { ...i, zIndex: minZ - 1 } : i));
  });
  const toggleFlip = (id) => setItems((prev) => prev.map((i) => (i.id === id ? { ...i, flip: !i.flip } : i)));
  const rotateItem = (id) => setItems((prev) => prev.map((i) => (i.id === id ? { ...i, rotation: (i.rotation + 15) % 360 } : i)));
  const zoomItem = (id, factor) => setItems((prev) => prev.map((i) => (i.id === id ? { ...i, w: clamp(i.w * factor, 20, 420), h: clamp(i.h * factor, 20, 420) } : i)));
  const deleteItem = (id) => { setItems((prev) => prev.filter((i) => i.id !== id)); setSelectedId((sel) => (sel === id ? null : sel)); };

  const handleItemPointerDown = (e, item) => {
    e.stopPropagation();
    e.currentTarget.setPointerCapture(e.pointerId);
    setSelectedId(item.id);
    setDraggingId(item.id);
    dragInfo.current = { id: item.id, startX: e.clientX, startY: e.clientY, originX: item.x, originY: item.y };
  };
  const handleItemPointerMove = (e, item) => {
    const d = dragInfo.current;
    if (!d || d.id !== item.id) return;
    const rect = canvasRef.current.getBoundingClientRect();
    const nx = clamp(d.originX + (e.clientX - d.startX), 0, rect.width);
    const ny = clamp(d.originY + (e.clientY - d.startY), 0, rect.height);
    updateItem(item.id, { x: nx, y: ny });
  };
  const handleItemPointerUp = () => { dragInfo.current = null; setDraggingId(null); };

  const handleFiles = (fileList) => {
    Array.from(fileList).forEach((file) => {
      const reader = new FileReader();
      reader.onload = () => {
        setCustomMaterials((prev) => [
          ...prev,
          {
            id: `custom-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`,
            category: 'custom',
            name: file.name.replace(/\.[^.]+$/, '').slice(0, 12) || '自訂花材',
            price: 20,
            defaultW: 90,
            defaultH: 90,
            imageSrc: reader.result,
          },
        ]);
      };
      reader.readAsDataURL(file);
    });
  };

  const handleExport = async () => {
    if (items.length === 0) return;
    setExporting(true);
    try {
      const rect = canvasRef.current.getBoundingClientRect();
      const scale = 2;
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(rect.width * scale);
      canvas.height = Math.round(rect.height * scale);
      const ctx = canvas.getContext('2d');
      ctx.scale(scale, scale);
      const sorted = [...items].sort((a, b) => a.zIndex - b.zIndex);
      const imgs = await Promise.all(sorted.map((it) => loadImage(it.imageSrc)));
      sorted.forEach((it, i) => {
        ctx.save();
        ctx.translate(it.x, it.y);
        ctx.rotate((it.rotation * Math.PI) / 180);
        ctx.scale(it.flip ? -1 : 1, 1);
        ctx.drawImage(imgs[i], -it.w / 2, -it.h / 2, it.w, it.h);
        ctx.restore();
      });
      setExportUrl(canvas.toDataURL('image/png'));
      setShowExport(true);
    } catch (err) {
      console.error(err);
    } finally {
      setExporting(false);
    }
  };

  useEffect(() => {
    const handler = (e) => {
      if (!selectedId) return;
      const tag = document.activeElement && document.activeElement.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA') return;
      if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); deleteItem(selectedId); }
    };
    window.addEventListener('keydown', handler);
    return () => window.removeEventListener('keydown', handler);
  }, [selectedId]);

  return (
    <div className="h-screen flex flex-col" style={{ background: APP_BG, color: INK, fontFamily: '-apple-system,"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif' }}>
      <style>{`
        @keyframes sheetUp { from { transform: translateY(56px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes toolbarIn { from { transform: translateX(-50%) translateY(-10px) scale(0.92); opacity: 0; } to { transform: translateX(-50%) translateY(0) scale(1); opacity: 1; } }
        input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        .active\\:scale-85:active { transform: scale(0.85); }
      `}</style>

      {/* 頂部毛玻璃導覽列 */}
      <header
        className="px-4 py-3 md:px-6 flex flex-wrap items-center justify-between gap-3 shrink-0"
        style={{
          background: 'rgba(62,92,70,0.86)', backdropFilter: 'blur(20px) saturate(1.6)', WebkitBackdropFilter: 'blur(20px) saturate(1.6)',
          color: '#F6F1E4', borderBottom: '1px solid rgba(255,255,255,0.12)',
        }}
      >
        <div>
          <h1 style={{ fontFamily: '"Noto Serif TC","Songti TC",serif' }} className="text-xl md:text-2xl font-semibold tracking-wide">Botanical Bliss</h1>
          <p className="text-xs md:text-sm opacity-80">線上 DIY 客製花束工作台</p>
        </div>
        <div className="flex items-center gap-4">
          <div className="text-sm opacity-90 text-right leading-snug">
            <div>花材數量 <span className="font-semibold">{items.length}</span> 件</div>
            <div>花束預估總價 <span className="font-semibold">NT$ {totalPrice}</span></div>
          </div>
          <button
            onClick={handleExport}
            disabled={items.length === 0 || exporting}
            style={{ background: items.length === 0 ? 'rgba(255,255,255,0.18)' : ROSE, transition: `transform 0.15s ${SPRING}, background-color 0.2s` }}
            className="px-4 py-2 rounded-full text-sm font-medium flex items-center gap-1.5 shadow-md active:scale-95 disabled:cursor-not-allowed"
          >
            <Icon name="sparkles" size={16} /> {exporting ? '生成中…' : '完成花束'}
          </button>
        </div>
      </header>

      <div className="flex-1 flex flex-col md:flex-row overflow-hidden">
        {/* 桌面版側邊欄：手機寬度下完全隱藏，改用下方的手機工具列 */}
        <aside className="hidden md:flex md:w-72 md:flex-col border-r" style={{ background: '#FBF6ED', borderColor: LINE }}>
          <TabChips activeTab={activeTab} onSelect={setActiveTab} />
          <MaterialPanel
            activeTab={activeTab}
            visibleMaterials={visibleMaterials}
            customCount={customMaterials.length}
            onAdd={addItem}
            onDelete={(id) => setCustomMaterials((prev) => prev.filter((x) => x.id !== id))}
            onChangePrice={(id, p) => setCustomMaterials((prev) => prev.map((x) => (x.id === id ? { ...x, price: p } : x)))}
            onChangeName={(id, n) => setCustomMaterials((prev) => prev.map((x) => (x.id === id ? { ...x, name: n } : x)))}
            onFiles={handleFiles}
          />
        </aside>

        {/* 手機版分類列：畫布正上方，點一下直接開啟下滑選材面板，不會把畫布往下擠 */}
        <div className="flex md:hidden shrink-0 min-w-0" style={{ background: '#FBF6ED', borderBottom: `1px solid ${LINE}` }}>
          <TabChips activeTab={activeTab} onSelect={(key) => { setActiveTab(key); setPickerOpen(true); }} />
        </div>

        <main className="flex-1 flex items-center justify-center p-4 md:p-8 overflow-auto">
          <div
            ref={canvasRef}
            onPointerDown={() => setSelectedId(null)}
            className="relative w-full aspect-square rounded-3xl overflow-hidden"
            style={{ maxWidth: 620, background: PAPER, border: `1px solid ${LINE}`, boxShadow: 'inset 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04)', touchAction: 'none' }}
          >
            {items.length === 0 && (
              <div className="absolute inset-0 flex flex-col items-center justify-center text-center px-8 pointer-events-none" style={{ color: INK, opacity: 0.45 }}>
                <div className="w-24 h-24 rounded-full border-2 border-dashed mb-3 animate-pulse" style={{ borderColor: INK }} />
                <p className="text-sm">從左側挑選花材，點一下就能加入工作台</p>
                <p className="text-xs mt-1">選取花材後可調整順序、翻轉、旋轉、縮放</p>
              </div>
            )}

            {[...items].sort((a, b) => a.zIndex - b.zIndex).map((item) => {
              const isDragging = draggingId === item.id;
              const isEntering = enteringId === item.id;
              const liftScale = isDragging ? 1.07 : 1;
              const entranceScale = isEntering ? 0.35 : 1;
              const transitionProperty = isDragging
                ? 'transform, filter'
                : 'left, top, transform, filter, opacity';
              return (
                <div
                  key={item.id}
                  onPointerDown={(e) => handleItemPointerDown(e, item)}
                  onPointerMove={(e) => handleItemPointerMove(e, item)}
                  onPointerUp={handleItemPointerUp}
                  style={{
                    position: 'absolute', left: item.x, top: item.y, width: item.w, height: item.h,
                    transform: `translate(-50%,-50%) rotate(${item.rotation}deg) scaleX(${item.flip ? -1 : 1}) scale(${liftScale * entranceScale})`,
                    opacity: isEntering ? 0 : 1,
                    filter: isDragging ? 'drop-shadow(0 16px 22px rgba(0,0,0,0.3))' : 'drop-shadow(0 3px 6px rgba(0,0,0,0.15))',
                    zIndex: item.zIndex, cursor: isDragging ? 'grabbing' : 'grab', touchAction: 'none',
                    outline: selectedId === item.id ? `2px dashed ${ROSE}` : 'none', outlineOffset: '4px',
                    transitionProperty, transitionDuration: '0.32s', transitionTimingFunction: SPRING,
                  }}
                >
                  <img src={item.imageSrc} alt={item.name} draggable={false} className="w-full h-full select-none pointer-events-none" />
                </div>
              );
            })}

            {selectedItem && (
              <div
                onPointerDown={(e) => e.stopPropagation()}
                className="absolute flex items-center gap-1 rounded-full px-2 py-1.5 shadow-xl overflow-x-auto"
                style={{
                  left: toolbarLeft, top: toolbarTop, maxWidth: '92%',
                  background: 'rgba(30,24,16,0.6)', backdropFilter: 'blur(16px) saturate(1.8)', WebkitBackdropFilter: 'blur(16px) saturate(1.8)',
                  border: '1px solid rgba(255,255,255,0.12)',
                  animation: `toolbarIn 0.25s ${SPRING} both`,
                  transitionProperty: 'left, top',
                  transitionDuration: draggingId === selectedItem.id ? '0s' : '0.28s',
                  transitionTimingFunction: SPRING,
                }}
              >
                <span className="text-xs px-2 whitespace-nowrap" style={{ color: '#F6F1E4' }}>{selectedItem.name}</span>
                <ToolbarBtn icon="chevronsUp" label="置前" onClick={() => bringFront(selectedItem.id)} />
                <ToolbarBtn icon="chevronsDown" label="置後" onClick={() => sendBack(selectedItem.id)} />
                <ToolbarBtn icon="flipHorizontal" label="翻轉" onClick={() => toggleFlip(selectedItem.id)} />
                <ToolbarBtn icon="rotateCw" label="旋轉" onClick={() => rotateItem(selectedItem.id)} />
                <ToolbarBtn icon="zoomOut" label="縮小" onClick={() => zoomItem(selectedItem.id, 0.9)} />
                <ToolbarBtn icon="zoomIn" label="放大" onClick={() => zoomItem(selectedItem.id, 1.1)} />
                <ToolbarBtn icon="trash2" label="刪除" onClick={() => deleteItem(selectedItem.id)} danger />
                <ToolbarBtn icon="x" label="取消選取" onClick={() => setSelectedId(null)} />
              </div>
            )}
          </div>
        </main>
      </div>

      {/* 手機版選材面板：從底部滑出，選完自動收合，回到畫布看成果 */}
      {pickerOpen && (
        <div
          className="fixed inset-0 z-40 flex items-end md:hidden"
          style={{ background: 'rgba(20,16,10,0.45)', backdropFilter: 'blur(2px)' }}
          onClick={() => setPickerOpen(false)}
        >
          <div
            onClick={(e) => e.stopPropagation()}
            className="w-full rounded-t-3xl flex flex-col"
            style={{ maxHeight: '78vh', background: '#FBF6ED', boxShadow: '0 -8px 40px rgba(0,0,0,0.18)', animation: `sheetUp 0.32s ${SPRING} both` }}
          >
            <div className="w-10 h-1.5 rounded-full mx-auto mt-3 mb-1 shrink-0" style={{ background: LINE }} />
            <TabChips activeTab={activeTab} onSelect={setActiveTab} />
            <MaterialPanel
              activeTab={activeTab}
              visibleMaterials={visibleMaterials}
              customCount={customMaterials.length}
              onAdd={(m) => { addItem(m); setPickerOpen(false); }}
              onDelete={(id) => setCustomMaterials((prev) => prev.filter((x) => x.id !== id))}
              onChangePrice={(id, p) => setCustomMaterials((prev) => prev.map((x) => (x.id === id ? { ...x, price: p } : x)))}
              onChangeName={(id, n) => setCustomMaterials((prev) => prev.map((x) => (x.id === id ? { ...x, name: n } : x)))}
              onFiles={handleFiles}
            />
          </div>
        </div>
      )}

      {/* 完成畫面：由下往上滑出的底部面板，貼近 iOS 分享面板的手感 */}
      {showExport && (
        <div
          className="fixed inset-0 z-50 flex items-end sm:items-center justify-center"
          style={{ background: 'rgba(20,16,10,0.5)', backdropFilter: 'blur(3px)' }}
          onClick={() => setShowExport(false)}
        >
          <div
            onClick={(e) => e.stopPropagation()}
            className="w-full sm:max-w-sm rounded-t-3xl sm:rounded-3xl p-6 pb-8 sm:pb-6 text-center"
            style={{
              background: 'rgba(251,246,237,0.92)', backdropFilter: 'blur(24px) saturate(1.4)', WebkitBackdropFilter: 'blur(24px) saturate(1.4)',
              boxShadow: '0 -8px 40px rgba(0,0,0,0.18)', animation: `sheetUp 0.38s ${SPRING} both`,
            }}
          >
            <div className="w-10 h-1.5 rounded-full mx-auto mb-4 sm:hidden" style={{ background: LINE }} />
            <Icon name="sparkles" size={22} style={{ color: ROSE }} className="mx-auto mb-2" />
            <h2 style={{ fontFamily: '"Noto Serif TC","Songti TC",serif', color: INK }} className="text-lg font-semibold mb-1">手作花束已完成</h2>
            <p className="text-xs mb-4" style={{ color: INK, opacity: 0.65 }}>高解析度去背圖已生成，點擊即可儲存</p>
            <div
              className="rounded-2xl overflow-hidden mb-5"
              style={{
                backgroundImage: 'linear-gradient(45deg,#e4ddcb 25%,transparent 25%),linear-gradient(-45deg,#e4ddcb 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#e4ddcb 75%),linear-gradient(-45deg,transparent 75%,#e4ddcb 75%)',
                backgroundSize: '16px 16px', backgroundPosition: '0 0,0 8px,8px -8px,-8px 0px', backgroundColor: '#f6f2e8',
              }}
            >
              {exportUrl && <img src={exportUrl} alt="花束預覽" className="w-full h-auto" />}
            </div>
            <div className="flex gap-3 justify-center flex-wrap">
              <button
                onClick={() => setShowExport(false)}
                className="px-4 py-2 rounded-full text-sm font-medium active:scale-95"
                style={{ border: `1px solid ${FOREST}`, color: FOREST, transition: `transform 0.15s ${SPRING}` }}
              >
                繼續調整
              </button>
              <a
                href={exportUrl} download="botanical-bliss-bouquet.png"
                className="px-4 py-2 rounded-full text-sm font-medium active:scale-95 shadow-md"
                style={{ background: ROSE, color: '#fff', transition: `transform 0.15s ${SPRING}` }}
              >
                下載花束圖片
              </a>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<BotanicalBouquetBuilder />);

</script>
</body>
</html>
