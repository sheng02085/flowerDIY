<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Botanical Bliss - 線上 DIY 客製花束工作台</title>
  <!-- 引入穩定版 Fabric.js 5.3.1 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Noto+Serif+TC:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #9d5c48;
      --primary-hover: #824735;
      --primary-light: #f7eee9;
      --accent: #556b4f;
      --accent-light: #eef3ed;
      --bg-warm: #f6f1eb;
      --canvas-bg: #fffdfa;
      --text-main: #2b231d;
      --text-muted: #82756a;
      --border-color: #ebdcd0;
      --shadow-sm: 0 4px 12px rgba(80, 50, 35, 0.06);
      --shadow-md: 0 12px 30px rgba(80, 50, 35, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background: linear-gradient(135deg, #f3ece4 0%, #e5dac9 100%);
      font-family: 'Plus Jakarta Sans', 'Noto Serif TC', serif, sans-serif;
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 10px;
    }

    .app-frame {
      width: 100%;
      max-width: 440px;
      height: 94vh;
      max-height: 880px;
      background: #ffffff;
      border-radius: 26px;
      box-shadow: 0 20px 50px rgba(70, 45, 30, 0.18);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    /* 頂部導航欄 */
    .top-navbar {
      height: 52px;
      padding: 0 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      background: #ffffff;
      z-index: 10;
    }

    .brand-title {
      font-family: 'Cinzel', serif;
      font-size: 17px;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: 1px;
    }

    .btn-finish {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 7px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 3px 10px rgba(157, 92, 72, 0.25);
    }
    .btn-finish:active {
      transform: scale(0.95);
      background: var(--primary-hover);
    }

    /* 上半部：插花工作台 */
    .workbench-section {
      position: relative;
      background: radial-gradient(circle at center, #ffffff 0%, var(--bg-warm) 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px 10px 4px 10px;
    }

    .canvas-wrapper {
      position: relative;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      border: 1.5px solid rgba(235, 220, 208, 0.8);
      background: var(--canvas-bg);
      touch-action: none;
    }

    /* 快捷工具浮動列 */
    .floating-tools {
      position: absolute;
      right: 18px;
      top: 18px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 5;
    }

    .tool-icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(235, 220, 208, 0.9);
      box-shadow: 0 3px 8px rgba(0,0,0,0.06);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s;
    }
    .tool-icon-btn:active {
      transform: scale(0.9);
      background: var(--primary-light);
    }
    .tool-icon-btn svg {
      width: 16px;
      height: 16px;
      stroke: var(--text-main);
      fill: none;
      stroke-width: 2.2;
    }
    .tool-icon-btn span {
      font-size: 8px;
      color: var(--text-muted);
      margin-top: 1px;
      font-weight: 700;
    }

    /* 資訊統計條 */
    .bouquet-summary-bar {
      width: 92%;
      margin: 8px auto 4px;
      padding: 8px 14px;
      background: #ffffff;
      border-radius: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
      border: 1px solid var(--border-color);
    }
    .summary-item {
      display: flex;
      flex-direction: column;
    }
    .summary-label {
      font-size: 10px;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 600;
    }
    .summary-val {
      font-size: 14px;
      font-weight: 700;
      color: var(--primary);
    }

    /* 下半部：花材分類與選擇庫 */
    .selector-container {
      flex: 1;
      background: #ffffff;
      border-top: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-radius: 20px 20px 0 0;
    }

    .category-tabs {
      display: flex;
      padding: 10px 16px 6px;
      gap: 16px;
      border-bottom: 1px solid #f2e9e1;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .category-tabs::-webkit-scrollbar { display: none; }

    .tab-item {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      padding: 6px 4px 8px;
      cursor: pointer;
      position: relative;
      white-space: nowrap;
      transition: color 0.2s;
    }
    .tab-item.active {
      color: var(--primary);
    }
    .tab-item.active::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 2.5px;
      background: var(--primary);
      border-radius: 4px;
    }

    /* 卡片列表 */
    .flower-grid {
      flex: 1;
      overflow-y: auto;
      padding: 12px 14px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .flower-item-card {
      background: #faf8f5;
      border: 1px solid #ebdcd0;
      border-radius: 16px;
      padding: 8px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
    }
    .flower-item-card:hover {
      border-color: var(--primary);
      background: #ffffff;
      box-shadow: 0 4px 12px rgba(157, 92, 72, 0.12);
    }
    .flower-item-card:active {
      transform: scale(0.94);
    }
    .card-img-wrap {
      width: 60px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 4px;
    }
    .card-img-wrap svg {
      width: 54px;
      height: 54px;
      pointer-events: none;
    }
    .card-name {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-main);
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
    }
    .card-price {
      font-size: 10px;
      font-weight: 700;
      color: var(--primary);
      margin-top: 2px;
    }
    .card-badge {
      position: absolute;
      top: 4px;
      right: 4px;
      background: rgba(85, 107, 79, 0.15);
      color: var(--accent);
      font-size: 8px;
      padding: 1px 4px;
      border-radius: 6px;
      font-weight: 700;
    }

    /* 彈窗 */
    .modal-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(30, 20, 15, 0.6);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }
    .modal-box {
      background: #ffffff;
      width: 100%;
      max-width: 340px;
      border-radius: 24px;
      padding: 20px;
      text-align: center;
      box-shadow: var(--shadow-md);
      animation: popIn 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes popIn {
      from { transform: scale(0.85); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-box h3 {
      font-family: 'Noto Serif TC', serif;
      font-size: 17px;
      color: var(--primary);
      margin-bottom: 6px;
    }
    .preview-img-container {
      width: 220px;
      height: 240px;
      margin: 10px auto;
      border-radius: 16px;
      background: var(--bg-warm);
      border: 1px dashed var(--border-color);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .preview-img-container img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    .modal-btns {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }
    .btn-modal {
      flex: 1;
      padding: 10px;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: none;
    }
    .btn-modal.cancel {
      background: #f0ebe6;
      color: var(--text-muted);
    }
    .btn-modal.confirm {
      background: var(--primary);
      color: #fff;
    }
  </style>
</head>
<body>

  <div class="app-frame">
    <!-- 頂部導航 -->
    <div class="top-navbar">
      <div class="brand-title">Botanical DIY</div>
      <button class="btn-finish" onclick="openFinishModal()">完成匯出</button>
    </div>

    <!-- 上半部：插花工作台 -->
    <div class="workbench-section">
      <div class="canvas-wrapper">
        <canvas id="flowerCanvas" width="320" height="290"></canvas>
        
        <!-- 畫布右側快捷浮動按鈕 -->
        <div class="floating-tools">
          <div class="tool-icon-btn" onclick="bringForward()" title="置前一層">
            <svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
            <span>置前</span>
          </div>
          <div class="tool-icon-btn" onclick="sendBackwards()" title="置後一層">
            <svg viewBox="0 0 24 24"><path d="M12 5v14M19 12l-7 7-7-7"/></svg>
            <span>置後</span>
          </div>
          <div class="tool-icon-btn" onclick="flipHorizontal()" title="水平翻轉">
            <svg viewBox="0 0 24 24"><path d="M7 16l-4-4 4-4M17 8l4 4-4 4M3 12h18"/></svg>
            <span>翻轉</span>
          </div>
          <div class="tool-icon-btn" onclick="rotate45()" title="旋轉花朵">
            <svg viewBox="0 0 24 24"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l6.23-5.19"/></svg>
            <span>旋轉</span>
          </div>
          <div class="tool-icon-btn" onclick="deleteActive()" title="刪除選定花材">
            <svg viewBox="0 0 24 24" style="stroke:#c94a4a;"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
            <span style="color:#c94a4a;">刪除</span>
          </div>
        </div>
      </div>

      <!-- 即時價格與花材統計 -->
      <div class="bouquet-summary-bar">
        <div class="summary-item">
          <span class="summary-label">花材數量</span>
          <span class="summary-val" id="totalCount">0 件</span>
        </div>
        <div class="summary-item" style="text-align: right;">
          <span class="summary-label">花束預估總價</span>
          <span class="summary-val" id="totalPrice">NT$ 0</span>
        </div>
      </div>
    </div>

    <!-- 下半部：花材庫 -->
    <div class="selector-container">
      <div class="category-tabs">
        <div class="tab-item active" onclick="switchCategory('main', this)">主花材 (Main)</div>
        <div class="tab-item" onclick="switchCategory('filler', this)">配花 (Fillers)</div>
        <div class="tab-item" onclick="switchCategory('foliage', this)">綠葉 (Foliage)</div>
        <div class="tab-item" onclick="switchCategory('wrap', this)">包裝與緞帶 (Wraps)</div>
      </div>

      <div class="flower-grid" id="flowerGrid"></div>
    </div>

    <!-- 匯出完成彈窗 -->
    <div class="modal-overlay" id="finishModal">
      <div class="modal-box">
        <h3>✨ 手作花束已完成</h3>
        <p style="font-size:12px; color:var(--text-muted); margin-bottom: 6px;">高清去背圖已生成，點擊即可儲存</p>
        <div class="preview-img-container">
          <img id="exportPreview" src="" alt="花束預覽">
        </div>
        <div class="modal-btns">
          <button class="btn-modal cancel" onclick="closeFinishModal()">繼續調整</button>
          <button class="btn-modal confirm" onclick="downloadImage()">下載花束圖片</button>
        </div>
      </div>
    </div>
  </div>

    // 花材清單分類
    const flowerCatalog = {
      main: [
        { id: "rose_peach", name: "蜜桃茱麗葉玫瑰", price: 85, badge: "熱銷主花", svg: SVGS.rose_peach },
        { id: "tulip_apricot", name: "杏橙鬱金香", price: 65, badge: "當季人氣", svg: SVGS.tulip_apricot },
        { id: "peony_pink", name: "法式粉紅牡丹", price: 110, badge: "奢華高雅", svg: SVGS.peony_pink },
        { id: "dahlia_white", name: "雪白大麗花", price: 95, badge: "典雅必備", svg: SVGS.dahlia_white }
      ],
      filler: [
        { id: "babysbreath", name: "雪白滿天星", price: 45, badge: "百搭點綴", svg: SVGS.babysbreath },
        { id: "bluebell", name: "唯美藍風鈴", price: 55, badge: "空靈感", svg: SVGS.bluebell }
      ],
      foliage: [
        { id: "eucalyptus", name: "圓葉尤加利", price: 35, badge: "自然清香", svg: SVGS.eucalyptus },
        { id: "monstera", name: "龜背芋葉", price: 40, badge: "立體襯葉", svg: SVGS.monstera }
      ],
      wrap: [
        { id: "kraft_wrap", name: "法式牛皮包裝底襯", price: 120, badge: "底襯配件", svg: SVGS.kraft_wrap },
        { id: "silk_ribbon", name: "櫻粉絲綢緞帶", price: 50, badge: "束口裝飾", svg: SVGS.silk_ribbon }
      ]
    };

    // 初始化 Fabric.js 畫布
    const canvas = new fabric.Canvas('flowerCanvas', {
      preserveObjectStacking: true,
      selectionColor: 'rgba(157, 92, 72, 0.15)',
      selectionBorderColor: '#9d5c48',
      selectionLineWidth: 1.5
    });

    // 渲染花材卡片列表
    function renderGrid(catKey) {
      const grid = document.getElementById('flowerGrid');
      grid.innerHTML = '';
      const items = flowerCatalog[catKey] || [];

      items.forEach(item => {
        const card = document.createElement('div');
        card.className = 'flower-item-card';
        card.onclick = () => addFlowerToCanvas(item);
        
        const badgeHtml = item.badge ? `<span class="card-badge">${item.badge}</span>` : '';
        
        card.innerHTML = `
          ${badgeHtml}
          <div class="card-img-wrap">
            ${item.svg}
          </div>
          <div class="card-name">${item.name}</div>
          <div class="card-price">NT$ ${item.price}</div>
        `;
        grid.appendChild(card);
      });
    }

    // 分類切換
    function switchCategory(catKey, element) {
      document.querySelectorAll('.tab-item').forEach(el => el.classList.remove('active'));
      element.classList.add('active');
      renderGrid(catKey);
    }

    // ★ 關鍵修復：使用原生 fabric.loadSVGFromString 解析向量物件，永不失真、不變形、完美匯出
    function addFlowerToCanvas(flower) {
      fabric.loadSVGFromString(flower.svg, function(objects, options) {
        const flowerGroup = fabric.util.groupSVGElements(objects, options);
        
        let scale = 1.0;
        let leftPos = 110 + (Math.random() * 40 - 20);
        let topPos = 70 + (Math.random() * 40 - 20);

        if (flower.id === 'kraft_wrap') {
          scale = 1.6;
          leftPos = 65;
          topPos = 80;
        } else if (flower.id === 'silk_ribbon') {
          scale = 1.1;
          leftPos = 110;
          topPos = 150;
        }

        flowerGroup.set({
          left: leftPos,
          top: topPos,
          scaleX: scale,
          scaleY: scale,
          cornerColor: '#9d5c48',
          cornerStrokeColor: '#ffffff',
          borderColor: '#9d5c48',
          cornerSize: 10,
          transparentCorners: false,
          padding: 6
        });

        flowerGroup.customData = {
          id: flower.id,
          name: flower.name,
          price: flower.price
        };

        canvas.add(flowerGroup);

        if (flower.id === 'kraft_wrap') {
          canvas.sendToBack(flowerGroup);
        } else {
          canvas.setActiveObject(flowerGroup);
        }

        canvas.renderAll();
        updateSummary();
      });
    }

    // 價格與數量統計
    function updateSummary() {
      const objects = canvas.getObjects();
      let totalCount = 0;
      let totalPrice = 0;

      objects.forEach(obj => {
        if (obj.customData) {
          totalCount += 1;
          totalPrice += obj.customData.price || 0;
        }
      });

      document.getElementById('totalCount').innerText = `${totalCount} 件`;
      document.getElementById('totalPrice').innerText = `NT$ ${totalPrice.toLocaleString()}`;
    }

    // 工具功能
    function bringForward() {
      const active = canvas.getActiveObject();
      if (active) {
        canvas.bringForward(active);
        canvas.renderAll();
      }
    }

    function sendBackwards() {
      const active = canvas.getActiveObject();
      if (active) {
        canvas.sendBackwards(active);
        canvas.renderAll();
      }
    }

    function flipHorizontal() {
      const active = canvas.getActiveObject();
      if (active) {
        active.set('flipX', !active.flipX);
        canvas.renderAll();
      }
    }

    function rotate45() {
      const active = canvas.getActiveObject();
      if (active) {
        active.set('angle', (active.angle + 30) % 360);
        canvas.renderAll();
      }
    }

    function deleteActive() {
      const active = canvas.getActiveObject();
      if (active) {
        canvas.remove(active);
        canvas.discardActiveObject();
        canvas.renderAll();
        updateSummary();
      }
    }

    canvas.on('selection:cleared', updateSummary);
    canvas.on('object:modified', updateSummary);

    // 完成與匯出彈窗
    function openFinishModal() {
      canvas.discardActiveObject();
      canvas.renderAll();
      
      const dataUrl = canvas.toDataURL({
        format: 'png',
        quality: 1,
        multiplier: 2
      });
      
      document.getElementById('exportPreview').src = dataUrl;
      document.getElementById('finishModal').style.display = 'flex';
    }

    function closeFinishModal() {
      document.getElementById('finishModal').style.display = 'none';
    }

    function downloadImage() {
      const dataUrl = document.getElementById('exportPreview').src;
      const link = document.createElement('a');
      link.download = 'my-custom-bouquet.png';
      link.href = dataUrl;
      link.click();
      closeFinishModal();
    }

    // 初始化頁面與預設花束
    window.addEventListener('DOMContentLoaded', () => {
      renderGrid('main');
      
      // 自動預載一組花束與底襯
      addFlowerToCanvas(flowerCatalog.wrap[0]);
      setTimeout(() => {
        addFlowerToCanvas(flowerCatalog.main[0]);
      }, 150);
    });
  </script>
</body>
</html>
